name: Android Build From ZIP

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Android WebView ZIP
        id: project
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT_DIR="$RUNNER_TEMP/tokotanah-android-src"
          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          SELECTED_ZIP=""

          while IFS= read -r zipfile; do
            echo "Checking ZIP: $zipfile"

            if unzip -Z1 "$zipfile" | grep -Eq '(^|/)settings\.gradle$' \
              && unzip -Z1 "$zipfile" | grep -Eq '(^|/)app/build\.gradle$'; then
              SELECTED_ZIP="$zipfile"
              break
            fi
          done < <(find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -iname '*.zip' -print | sort)

          if [ -z "$SELECTED_ZIP" ]; then
            echo "ERROR: ZIP project Android tidak ditemukan."
            echo "Upload ZIP WebView ke repository. ZIP harus berisi settings.gradle dan app/build.gradle."
            echo "File di repository:"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -print | sort
            exit 1
          fi

          echo "Selected ZIP: $SELECTED_ZIP"
          unzip -q "$SELECTED_ZIP" -d "$EXTRACT_DIR"

          PROJECT_DIR=""
          while IFS= read -r settings_file; do
            candidate="$(dirname "$settings_file")"
            if { [ -f "$candidate/build.gradle" ] || [ -f "$candidate/build.gradle.kts" ]; } \
              && { [ -f "$candidate/app/build.gradle" ] || [ -f "$candidate/app/build.gradle.kts" ]; }; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(find "$EXTRACT_DIR" -maxdepth 7 -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print | sort)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: ZIP berhasil diekstrak tetapi root project Android tidak ditemukan."
            find "$EXTRACT_DIR" -maxdepth 5 -print | sort | head -n 300
            exit 1
          fi

          echo "Android project root: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "zip=$SELECTED_ZIP" >> "$GITHUB_OUTPUT"

          echo "--- Android project files ---"
          find "$PROJECT_DIR" -maxdepth 3 -mindepth 1 -print | sort | head -n 250

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare Gradle Wrapper
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          if [ -f "./gradlew" ] && [ -f "./gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "Existing Gradle Wrapper found."
            chmod +x ./gradlew
          else
            echo "Gradle Wrapper not found; generating Gradle 8.13 wrapper."
            gradle --no-daemon wrapper --gradle-version 8.13 --distribution-type bin
            chmod +x ./gradlew
          fi

          ./gradlew --version

      - name: Build debug APK
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tokotanah-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }
          echo "All signing secrets are available."

      - name: Prepare Play Store signing
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$PROJECT_DIR/app/upload-keystore.jks"

          cat > "$PROJECT_DIR/keystore.properties" <<EOF_SIGNING
          storeFile=app/upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF_SIGNING

          keytool -list \
            -keystore "$PROJECT_DIR/app/upload-keystore.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

          echo "Signing keystore validated."

      - name: Build signed release AAB
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace bundleRelease

      - name: Verify release AAB signature
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          AAB="$PROJECT_DIR/app/build/outputs/bundle/release/app-release.aab"
          test -f "$AAB"
          jarsigner -verify "$AAB"
          echo "Signed AAB verified: $AAB"

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: tokotanah-playstore-aab
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Clean signing files
        if: always()
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          if [ -n "${PROJECT_DIR:-}" ]; then
            rm -f "$PROJECT_DIR/app/upload-keystore.jks" "$PROJECT_DIR/keystore.properties"
          fi
